---
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
      # - id: identity  # Prints all files passed to pre-commits. Debugging.
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.27.0
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=10000
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
        types:
          - text
      - id: mixed-line-ending
        args:
          - --fix=lf
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: name-tests-test
        args:
          - --pytest-test-first
      - id: no-commit-to-branch
        args:
          - --branch
          - main
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: variable_to_metadata_mapping\.yaml
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        types_or:
          - jupyter
          - pyi
          - python
        args:
          - --fix
      - id: ruff-format
        types_or:
          - jupyter
          - pyi
          - python
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.68
    hooks:
      - id: ty
        # `--no-project` keeps uv from creating a `.venv`/`uv.lock` in this
        # pixi-managed repo; ty resolves third-party imports from the env named
        # in `[tool.ty] environment.python` (run `pixi install` once).
        args:
          - --no-project
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff
        args:
          - --wrap
          - '88'
        files: (AGENTS\.md|CLAUDE\.md|README\.md)
      - id: mdformat
        additional_dependencies:
          - mdformat-myst
          - mdformat-ruff
        args:
          - --wrap
          - '88'
        files: (docs/.)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --skip=*.lock,*.ipynb
          - --ignore-words=.codespell-wordlist.txt
  - repo: local
    hooks:
      # Runs at pre-commit stage and fails if the config declares pre-push hooks
      # that this clone never installed — otherwise they look active and silently
      # never fire.
      - id: pre-push-hooks-installed
        name: pre-push hooks are installed in this clone
        entry: .ai-instructions/hooks/check_pre_push_installed.py
        language: script
        pass_filenames: false
        always_run: true
      # `--check` re-solves and compares without writing, so it cannot dirty the
      # worktree. pre-push, not pre-commit: a mid-branch commit may legitimately
      # lag the lock, but a push with a stale lock burns a CI cycle.
      - id: pixi-lock-check
        name: pixi.lock is in sync with the manifest
        entry: pixi lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|pixi\.toml|pixi\.lock)$
        stages:
          - pre-push
      - id: no-hardcoded-user-paths
        name: no hardcoded user-specific absolute paths
        language: pygrep
        entry: (/home/[A-Za-z0-9_.-]+/|/Users/[A-Za-z0-9_.-]+/|[A-Za-z]:\\Users\\)
        types_or:
          - python
          - toml
      - id: no-section-separator-comments
        name: no decorative section-separator comments
        language: pygrep
        entry: ^\s*#\s*[-=#_*]{10,}\s*$
        types:
          - python
ci:
  autoupdate_schedule: monthly
  # pre-commit.ci has no pixi environments and blocks network at hook runtime;
  # the GitHub Actions run-ty job covers type checking, and pixi-lock-check needs
  # a pixi binary that pre-commit.ci does not provide.
  skip:
    - ty
    - pixi-lock-check
